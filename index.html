<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Half-Clutch Jenkins Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h2>Half-Clutch Jenkins Dashboard</h2>
        <div id="connection-status" class="status-pill">Connecting to API...</div>
    </div>

    <div class="board">
        <div class="column">
            <div class="column-header" style="color:#2196f3">Queued</div>
            <div id="q-list" class="card-container"></div>
        </div>
        <div class="column">
            <div class="column-header" style="color:#ff9800">In Progress</div>
            <div id="p-list" class="card-container"></div>
        </div>
        <div class="column">
            <div class="column-header" style="color:#4caf50">Completed</div>
            <div id="c-list" class="card-container"></div>
        </div>
    </div>

    <h3>📜 Postgres Database History</h3>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Job ID</th>
                    <th>Repository</th>
                    <th>Importance</th>
                    <th>File Size</th>
                    <th>Code Hash (MD5)</th>
                    <th>Final Status</th>
                </tr>
            </thead>
            <tbody id="db-table"></tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
