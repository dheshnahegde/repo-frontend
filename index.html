<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Jenkins | Priority Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Mini-Jenkins Dashboard</h1>
            <div class="status-bar">
                <div class="status-item">
                    <strong>Active Workers:</strong> <span id="active-workers">0</span> / 3
                </div>
                <div class="status-item">
                    <strong>System:</strong> <span class="status-online">Online</span>
                </div>
            </div>
        </header>

        <main>
            <section class="job-table-section">
                <h2>Build Queue & History</h2>
                <table id="job-table">
                    <thead>
                        <tr>
                            <th>Job ID</th>
                            <th>Repository</th>
                            <th>Priority Score</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="job-body">
                        </tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
